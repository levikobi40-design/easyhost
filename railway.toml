[build]
builder = "NIXPACKS"
buildCommand = "npm install && CI=false npm run build && pip install -r requirements.txt"

[deploy]
startCommand = "PYTHONPATH=. gunicorn app:app --workers 1 --timeout 120 --bind 0.0.0.0:$PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
