<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Maya - Your Personal Host">
  <defs>
    <radialGradient id="mayaBg" cx="32%" cy="22%" r="82%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#060a14"/>
    </radialGradient>
    <linearGradient id="mayaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00c875"/>
    </linearGradient>
    <linearGradient id="mayaSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6d7c3"/>
      <stop offset="100%" stop-color="#e8b89a"/>
    </linearGradient>
    <linearGradient id="mayaHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1a12"/>
      <stop offset="100%" stop-color="#1a100c"/>
    </linearGradient>
    <linearGradient id="mayaBlush" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4a7a0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f4a7a0" stop-opacity="0"/>
    </linearGradient>
    <filter id="mayaGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="mayaSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="mayaRound">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

