# Node: let the Nixpacks Node provider install ONE version (package.json detected).
# Do NOT add nodejs_* to nixPkgs — that duplicates the provider and causes header collisions.
# Python: use the Nixpacks Python provider venv (/opt/venv) — never bare nix python311/pip.

# Mixed Node+Python: force both providers (Node 22 only via NIXPACKS_NODE_VERSION).
providers = ["node", "python"]

[variables]
NIXPACKS_NODE_VERSION = "22"
NIXPACKS_PYTHON_VERSION = "3.11"
CI = "false"

[phases."node:build"]
cmds = ["...", "npm run build"]

[start]
cmd = "PYTHONPATH=. /opt/venv/bin/gunicorn app:app --workers 1 --timeout 120 --bind 0.0.0.0:$PORT"
